version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: restrovibe-db
    environment:
      POSTGRES_USER: ${DB_USER:-restrovibe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restrovibe_password}
      POSTGRES_DB: ${DB_NAME:-restrovibe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-restrovibe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: restrovibe-server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: restrovibe-client
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_MAP_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
